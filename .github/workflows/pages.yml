name: Deploy Fable showcase to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/videos.json"
      - "data/local-media.json"
      - "data/library/**"
      - "data/categories/**"
      - "media/**"
      - "covers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build static pages
        run: python3 site/build.py
      - name: Check pages and local links
        run: python3 site/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
